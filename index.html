<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackstar</title>
  <style>
    :root {
      --ink: #f2e4cf;
      --ink-dim: rgba(242, 228, 207, 0.55);
      --panel: rgba(16, 7, 4, 0.93);
      --line: rgba(255, 140, 70, 0.16);
      --accent: #ff7a2a;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f3a63c; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #error {
      position: fixed; inset: auto 16px 16px 16px; padding: 12px 14px; z-index: 5;
      font: 12px/1.5 var(--mono); white-space: pre-wrap; color: #ffd9c2; background: #2a0703; border: 1px solid #a3260b;
    }

    #cog {
      position: fixed; top: 14px; left: 14px; z-index: 3; width: 38px; height: 38px; padding: 8px;
      border: 0; border-radius: 50%; background: rgba(20, 8, 4, 0.28); color: var(--ink);
      cursor: pointer; opacity: 0.6; transition: opacity .2s, transform .5s, background .2s;
    }
    #cog:hover, #cog[aria-expanded="true"] { opacity: 1; transform: rotate(60deg); background: rgba(20, 8, 4, 0.6); }
    #cog svg { width: 100%; height: 100%; display: block; }

    #panel {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 2; width: min(340px, 100vw);
      display: flex; flex-direction: column; color: var(--ink); background: var(--panel);
      border-right: 1px solid var(--line); font: 11px/1.4 var(--mono);
      transform: translateX(-102%); transition: transform .28s cubic-bezier(.2, .7, .2, 1);
    }
    #panel.open { transform: none; }
    body.clean #cog, body.clean #panel { display: none; }

    .head { display: flex; align-items: center; gap: 10px; padding: 18px 14px 12px 62px; border-bottom: 1px solid var(--line); }
    .head h1 { margin: 0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; }
    #fps { color: var(--ink-dim); flex: 1; text-align: right; }
    #close { background: none; border: 0; color: var(--ink-dim); font: 16px var(--mono); cursor: pointer; padding: 0 2px; }
    #close:hover { color: var(--ink); }

    #controls { flex: 1; overflow-y: auto; padding: 4px 0 10px; overscroll-behavior: contain; }
    .group { border-bottom: 1px solid var(--line); }
    .group summary {
      cursor: pointer; padding: 10px 14px; list-style: none; user-select: none;
      letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-size: 10px;
    }
    .group summary::-webkit-details-marker { display: none; }
    .group summary::before { content: "▸ "; display: inline-block; width: 1.2em; }
    .group[open] summary::before { content: "▾ "; }

    .row { display: grid; grid-template-columns: 112px 1fr 62px; align-items: center; gap: 8px; padding: 3px 14px; }
    .row-bool { grid-template-columns: 112px 1fr; }
    .lbl { color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; user-select: none; }
    .row.changed .lbl { color: var(--ink); }
    .row.changed .lbl::after { content: " •"; color: var(--accent); }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
    input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(242, 228, 207, 0.22); }
    input[type=range]::-moz-range-track { height: 2px; background: rgba(242, 228, 207, 0.22); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border-radius: 50%; background: var(--ink); }
    input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--ink); }
    .row.changed input[type=range]::-webkit-slider-thumb { background: var(--accent); }
    .row.changed input[type=range]::-moz-range-thumb { background: var(--accent); }

    .num {
      width: 100%; padding: 2px 4px; border: 1px solid var(--line); border-radius: 2px;
      background: rgba(0, 0, 0, 0.25); color: var(--ink); font: 11px var(--mono);
    }
    .num:focus, textarea:focus { outline: 1px solid var(--accent); }
    input[type=color] { width: 100%; height: 18px; padding: 0; border: 1px solid var(--line); background: none; cursor: pointer; }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch { border: 0; }
    input[type=checkbox] { justify-self: start; accent-color: var(--accent); margin: 0; }

    .state { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
    .state textarea {
      width: 100%; height: 58px; resize: vertical; padding: 6px; border: 1px solid var(--line); border-radius: 2px;
      background: rgba(0, 0, 0, 0.25); color: var(--ink); font: 11px/1.4 var(--mono);
    }
    .state textarea::placeholder { color: var(--ink-dim); }
    .opts { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); }
    .opts input { accent-color: var(--accent); margin: 0; }
    .buttons { display: flex; gap: 8px; }
    .buttons button {
      flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
      background: rgba(0, 0, 0, 0.3); color: var(--ink); font: 11px var(--mono); letter-spacing: .06em;
    }
    .buttons button:hover { border-color: var(--accent); }
    #copy { background: var(--accent); border-color: var(--accent); color: #1a0703; font-weight: 600; }
    #copy:hover { filter: brightness(1.1); }
    #status { color: var(--ink-dim); min-height: 1.4em; }
    .keys { color: var(--ink-dim); opacity: .7; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="error" hidden></div>

  <button id="cog" aria-label="Controls" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <aside id="panel" aria-hidden="true" aria-label="Design parameters">
    <div class="head">
      <h1>Blackstar</h1>
      <span id="fps"></span>
      <button id="close" aria-label="Close controls">×</button>
    </div>
    <div id="controls"></div>
    <div class="state">
      <textarea id="notes" placeholder="Notes for Claude (optional) — e.g. &quot;halo should feel hotter on the left&quot;"></textarea>
      <label class="opts"><input type="checkbox" id="include-all"> include every value, not just changes</label>
      <div class="buttons">
        <button id="copy">Copy state</button>
        <button id="reset">Reset all</button>
      </div>
      <div id="status"></div>
      <div class="keys">Esc close · H hide UI · Space pause · dbl-click a label to reset it</div>
    </div>
  </aside>

  <script src="params.js"></script>
  <script src="shader.js"></script>
  <script src="app.js"></script>
</body>
</html>
