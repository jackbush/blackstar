<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Browser bars can't show canvas pixels, so they take the orb's edge colour (kept in sync by app.js).
       Added to the home screen, iOS runs it truly full-screen under a transparent status bar. -->
  <meta name="theme-color" content="#1c0605">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blackstar">
  <title>Blackstar</title>
  <!-- __VERSION__ is replaced with the commit hash by .github/workflows/pages.yml on deploy. -->
  <meta name="build" content="__VERSION__">
  <script>
    (function () {
      var build = document.querySelector('meta[name="build"]').content;
      if (build.indexOf('__') === 0) return; // local dev: not stamped
      function check() {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (!j || !j.version || j.version === build) return;
            var key = 'blackstar:reloaded-for';
            try { if (sessionStorage.getItem(key) === j.version) return; sessionStorage.setItem(key, j.version); } catch (_) {}
            location.replace(location.pathname + '?v=' + j.version + location.hash);
          })
          .catch(function () {});
      }
      check();
      window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
    })();
  </script>
  <style>
    :root {
      --ink: #f4f4f4;
      --ink-dim: rgba(255, 255, 255, 0.5);
      --panel: #000;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #fff;
      --panel-w: min(410px, 100vw);
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c0605; }
    #stage {
      /* lvh = full screen height including the area behind mobile browser bars, so the bars show
         the animation through them instead of a flat page colour. */
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100lvh; display: block;
      transition: left .28s cubic-bezier(.2, .7, .2, 1), width .28s cubic-bezier(.2, .7, .2, 1);
    }
    /* With the panel open, the animation fits the remaining area so its edges stay visible. */
    @media (min-width: 700px) {
      body[data-ui="open"] #stage { left: var(--panel-w); width: calc(100% - var(--panel-w)); }
    }

    #error {
      position: fixed; inset: auto 16px 16px 16px; padding: 12px 14px; z-index: 5;
      font: 12px/1.5 var(--mono); white-space: pre-wrap; color: #ffd9c2; background: #2a0703; border: 1px solid #a3260b;
    }

    #cog {
      position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); z-index: 3; width: 38px; height: 38px; padding: 8px;
      border: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.3); color: var(--ink);
      cursor: pointer; opacity: 0.6; transition: opacity .2s, transform .5s, background .2s;
    }
    #cog:hover, #cog[aria-expanded="true"] { opacity: 1; transform: rotate(60deg); background: rgba(0, 0, 0, 0.6); }
    #cog svg { width: 100%; height: 100%; display: block; }

    #panel {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 2; width: var(--panel-w);
      display: flex; flex-direction: column; color: var(--ink); background: var(--panel);
      border-right: 1px solid var(--line); font: 11px/1.4 var(--mono);
      transform: translateX(-102%); transition: transform .28s cubic-bezier(.2, .7, .2, 1);
    }
    /* UI mode (press D): off = nothing shown, closed = cog only, open = cog + panel. */
    body[data-ui="open"] #panel { transform: none; }
    body[data-ui="off"] #cog, body[data-ui="off"] #panel { display: none; }

    .head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px 62px; padding-top: max(14px, env(safe-area-inset-top)); min-height: 62px; border-bottom: 1px solid var(--line); }
    .head h1 { margin: 0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; }
    #fps { color: var(--ink-dim); flex: 1; text-align: right; white-space: nowrap; }

    #controls { flex: 1; overflow-y: auto; padding: 4px 0 10px; overscroll-behavior: contain; }
    .group { border-bottom: 1px solid var(--line); }
    .group summary {
      cursor: pointer; padding: 10px 14px; list-style: none; user-select: none;
      letter-spacing: .14em; text-transform: uppercase; color: var(--ink); font-size: 10px;
    }
    .group summary::-webkit-details-marker { display: none; }
    .group summary::before { content: "▸ "; display: inline-block; width: 1.2em; }
    .group[open] summary::before { content: "▾ "; }

    .row { display: grid; grid-template-columns: 124px 1fr 84px; align-items: center; gap: 8px; padding: 3px 14px; }
    .row-bool { grid-template-columns: 124px 1fr; }
    .lbl { color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; user-select: none; }
    .row.changed .lbl { color: var(--ink); }
    .row.changed .lbl::after { content: " •"; color: var(--accent); }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
    input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(255, 255, 255, 0.2); }
    input[type=range]::-moz-range-track { height: 2px; background: rgba(255, 255, 255, 0.2); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border-radius: 50%; background: var(--ink-dim); }
    input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--ink-dim); }
    .row.changed input[type=range]::-webkit-slider-thumb { background: var(--accent); }
    .row.changed input[type=range]::-moz-range-thumb { background: var(--accent); }

    .num {
      width: 100%; padding: 2px 4px; border: 1px solid var(--line); border-radius: 2px;
      background: #0d0d0d; color: var(--ink); font: 11px var(--mono);
    }
    .num:focus { outline: 1px solid var(--accent); }
    /* No spinner arrows on number boxes — the sliders do the stepping. */
    .num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .num[type=number] { -moz-appearance: textfield; appearance: textfield; }
    input[type=color] { width: 100%; height: 18px; padding: 0; border: 1px solid var(--line); background: none; cursor: pointer; }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch { border: 0; }
    input[type=checkbox] { justify-self: start; accent-color: var(--accent); margin: 0; }

    .state { padding: 12px 14px max(14px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: grid; gap: 8px; }
    .changes { color: var(--ink-dim); }
    #reset { background: none; border: 0; padding: 0; color: var(--ink); font: inherit; cursor: pointer; }
    #reset:hover { text-decoration: underline; }
    #copy {
      width: 100%; padding: 9px; border: 0; border-radius: 2px; cursor: pointer;
      background: var(--ink); color: #000; font: 600 11px var(--mono); letter-spacing: .06em;
    }
    #copy:hover { background: #fff; }
  </style>
</head>
<body data-ui="off">
  <canvas id="stage"></canvas>
  <div id="error" hidden></div>

  <button id="cog" aria-label="Controls" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <aside id="panel" aria-hidden="true" aria-label="Design parameters">
    <div class="head">
      <h1>Blackstar</h1>
      <span id="fps"></span>
    </div>
    <div id="controls"></div>
    <div class="state">
      <div class="changes"><span id="status"></span> <button id="reset">[reset]</button></div>
      <button id="copy">Copy changes</button>
    </div>
  </aside>

  <script src="params.js?v=__VERSION__"></script>
  <script src="shader.js?v=__VERSION__"></script>
  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
